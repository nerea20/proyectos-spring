<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<title>Comerciales</title>
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
	<header th:replace="~{fragments/navigation :: navigation}"></header>
	<main class="container py-4">
		<p class="alert alert-info" th:if="${mensaje}" th:text="${mensaje}"></p>
		<div class="d-flex flex-column flex-sm-row align-items-sm-center justify-content-between gap-3 mb-4">
			<h1 class="h2 mb-0">Comerciales</h1>
			<a class="btn btn-primary" th:href="@{/comerciales/crear}">Crear comercial</a>
		</div>
		<div class="table-responsive">
			<table class="table table-striped table-hover align-middle">
				<thead class="table-light">
					<tr>
						<th scope="col">Id</th>
						<th scope="col">Nombre</th>
						<th scope="col">Apellido 1</th>
						<th scope="col">Apellido 2</th>
						<th scope="col">Comisión</th>
						<th scope="col">Acciones</th>
					</tr>
				</thead>
				<tbody>
					<tr th:each="comercial : ${comerciales}">
						<td th:text="${comercial.id}">0</td>
						<td th:text="${comercial.nombre}">Nombre</td>
						<td th:text="${comercial.apellido1}">Apellido1</td>
						<td th:text="${comercial.apellido2 ?: '&nbsp;'}">Apellido2</td>
						<td th:text="${comercial.comision}">0.0</td>
						<td class="text-nowrap">
							<div class="d-flex flex-wrap gap-2">
								<a class="btn btn-sm btn-outline-secondary" th:href="@{/comerciales/detalle/{id}(id=${comercial.id})}">Ver</a>
								<a class="btn btn-sm btn-outline-primary" th:href="@{/comerciales/editar/{id}(id=${comercial.id})}">Editar</a>
								<form th:action="@{/comerciales/eliminar/{id}(id=${comercial.id})}" method="post">
									<button class="btn btn-sm btn-outline-danger" type="submit">Eliminar</button>
								</form>
							</div>
						</td>
					</tr>
				</tbody>
			</table>
		</div>
	</main>
</body>
</html>
