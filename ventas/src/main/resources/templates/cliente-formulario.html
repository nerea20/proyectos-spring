<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Editar cliente</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <header th:replace="~{fragments/navigation :: navigation}"></header>
    <main class="container py-4">
        <h1 class="h2 mb-4">Editar cliente</h1>
        <form class="row g-3" th:action="@{/clientes/editar/{id}(id=${cliente.id})}" th:object="${cliente}" method="post">
            <div class="col-12 col-md-6">
                <label class="form-label" for="nombre">Nombre</label>
                <input class="form-control" id="nombre" type="text" th:field="*{nombre}" required>
            </div>
            <div class="col-12 col-md-6">
                <label class="form-label" for="apellido1">Apellido 1</label>
                <input class="form-control" id="apellido1" type="text" th:field="*{apellido1}" required>
            </div>
            <div class="col-12 col-md-6">
                <label class="form-label" for="apellido2">Apellido 2</label>
                <input class="form-control" id="apellido2" type="text" th:field="*{apellido2}">
            </div>
            <div class="col-12 col-md-6">
                <label class="form-label" for="ciudad">Ciudad</label>
                <input class="form-control" id="ciudad" type="text" th:field="*{ciudad}">
            </div>
            <div class="col-12 col-md-6">
                <label class="form-label" for="categoría">Categoría</label>
                <input class="form-control" id="categoría" type="number" th:field="*{categoría}">
            </div>
            <div class="col-12 d-flex gap-2">
                <button class="btn btn-primary" type="submit">Guardar</button>
                <a class="btn btn-outline-secondary" th:href="@{/clientes}">Cancelar</a>
            </div>
        </form>
        <hr class="my-4">
        <section aria-labelledby="vincular-comercial">
            <h2 class="h4 mb-3" id="vincular-comercial">Añadir comercial</h2>
            <form class="row g-3" th:action="@{/clientes/editar/{id}/comerciales(id=${cliente.id})}" method="post">
                <div class="col-12 col-md-6">
                    <label class="form-label" for="comercialId">Comercial</label>
                    <select class="form-select" id="comercialId" name="comercialId" required>
                        <option value="" selected disabled>Selecciona un comercial</option>
                        <option th:each="comercial : ${comercialesDisponibles}"
                                th:value="${comercial.id}"
                                th:text="|${comercial.nombre} ${comercial.apellido1} ${comercial.apellido2 ?: ''}|"></option>
                    </select>
                    <div class="form-text" th:if="${comercialesDisponibles.isEmpty()}">No hay comerciales disponibles para vincular.</div>
                </div>
                <div class="col-12 col-md-3">
                    <label class="form-label" for="fechaVinculo">Fecha</label>
                    <input class="form-control" id="fechaVinculo" name="fecha" type="date" required>
                </div>
                <div class="col-12 col-md-3">
                    <label class="form-label" for="prioridad">Prioridad</label>
                    <input class="form-control" id="prioridad" name="prioridad" type="number" min="1" step="1" required>
                </div>
                <div class="col-12">
                    <button class="btn btn-success" type="submit" th:disabled="${comercialesDisponibles.isEmpty()}">Añadir Comercial</button>
                </div>
            </form>
        </section>
        <section class="mt-4" aria-labelledby="comerciales-vinculados">
            <h2 class="h4 mb-3" id="comerciales-vinculados">Comerciales vinculados</h2>
            <p class="text-muted" th:if="${comercialesVinculados.isEmpty()}">Este cliente todavía no tiene comerciales vinculados.</p>
            <div class="table-responsive" th:if="${!comercialesVinculados.isEmpty()}">
                <table class="table table-striped">
                    <thead>
                        <tr><th>Comercial</th><th>Fecha</th><th>Prioridad</th><th>Acciones</th></tr>
                    </thead>
                    <tbody>
                        <tr th:each="vinculo : ${comercialesVinculados}">
                            <td th:text="${vinculo.comercialNombre}"></td>
                            <td th:text="${vinculo.fecha}"></td>
                            <td th:text="${vinculo.prioridad}"></td>
                            <td>
                                <form th:action="@{/clientes/editar/{id}/comerciales/{comercialId}/eliminar(id=${cliente.id}, comercialId=${vinculo.comercialId})}" method="post">
                                    <button class="btn btn-outline-danger btn-sm" type="submit">Borrar</button>
                                </form>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>
</body>
</html>
