<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Detalle del cliente</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <header th:replace="~{fragments/navigation :: navigation}"></header>
    <main class="container py-4">
        <h1 class="h2 mb-4">Detalle del cliente</h1>
        <dl class="row g-3 mb-4">
            <div class="col-12 col-md-6"><dt class="text-secondary">Id</dt><dd th:text="${cliente.id}"></dd></div>
            <div class="col-12 col-md-6"><dt class="text-secondary">Nombre</dt><dd th:text="${cliente.nombre}"></dd></div>
            <div class="col-12 col-md-6"><dt class="text-secondary">Apellido 1</dt><dd th:text="${cliente.apellido1}"></dd></div>
            <div class="col-12 col-md-6"><dt class="text-secondary">Apellido 2</dt><dd th:text="${cliente.apellido2}"></dd></div>
            <div class="col-12 col-md-6"><dt class="text-secondary">Ciudad</dt><dd th:text="${cliente.ciudad}"></dd></div>
            <div class="col-12 col-md-6"><dt class="text-secondary">Categoría</dt><dd th:text="${cliente.categoría}"></dd></div>
        </dl>
        <div class="d-flex flex-wrap gap-2">
            <a class="btn btn-outline-secondary" th:href="@{/clientes}">Volver a clientes</a>
            <a class="btn btn-primary" th:href="@{/clientes/editar/{id}(id=${cliente.id})}">Editar</a>
        </div>
    </main>
</body>
</html>
