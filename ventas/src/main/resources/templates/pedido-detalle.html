<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Detalle del pedido</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <header th:replace="~{fragments/navigation :: navigation}"></header>
    <main class="container py-4">
        <h1 class="h2 mb-4">Detalle del pedido</h1>
        <dl class="row g-3 mb-4">
            <div class="col-12 col-md-6"><dt class="text-secondary">Id</dt><dd th:text="${pedido.id}"></dd></div>
            <div class="col-12 col-md-6"><dt class="text-secondary">Fecha</dt><dd th:text="${pedido.fecha}"></dd></div>
            <div class="col-12 col-md-6"><dt class="text-secondary">Total</dt><dd th:text="${pedido.total}"></dd></div>
            <div class="col-12 col-md-6"><dt class="text-secondary">Cliente</dt><dd th:text="${pedido.clienteNombre}"></dd></div>
            <div class="col-12 col-md-6"><dt class="text-secondary">Comercial</dt><dd th:text="${pedido.comercialNombre}"></dd></div>
        </dl>
        <div class="d-flex flex-wrap gap-2">
            <a class="btn btn-outline-secondary" th:href="@{/pedidos}">Volver a pedidos</a>
            <a class="btn btn-primary" th:href="@{/pedidos/editar/{id}(id=${pedido.id})}">Editar</a>
        </div>
    </main>
</body>
</html>
