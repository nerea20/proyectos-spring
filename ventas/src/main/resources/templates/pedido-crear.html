<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Crear pedido</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <header th:replace="~{fragments/navigation :: navigation}"></header>
    <main class="container py-4">
        <h1 class="h2 mb-4">Crear pedido</h1>
        <p class="alert alert-danger" th:if="${error}" th:text="${error}"></p>
        <form class="row g-3" th:action="@{/pedidos/crear}" th:object="${pedido}" method="post">
            <div class="col-12 col-md-6">
                <label class="form-label" for="total">Total</label>
                <input class="form-control" id="total" type="number" step="0.01" min="0" th:field="*{total}" required>
            </div>
            <div class="col-12 col-md-6">
                <label class="form-label" for="fecha">Fecha</label>
                <input class="form-control" id="fecha" type="date" th:field="*{fecha}">
            </div>
            <div class="col-12 col-md-6">
                <label class="form-label" for="clienteId">Cliente</label>
                <select class="form-select" id="clienteId" th:field="*{clienteId}" required>
                    <option value="0" disabled>Selecciona un cliente</option>
                    <option th:each="cliente : ${clientes}" th:value="${cliente.id}"
                            th:text="${cliente.nombre + ' ' + cliente.apellido1 + (cliente.apellido2 != null ? ' ' + cliente.apellido2 : '')}"></option>
                </select>
            </div>
            <div class="col-12 col-md-6">
                <label class="form-label" for="comercialId">Comercial</label>
                <select class="form-select" id="comercialId" th:field="*{comercialId}" required>
                    <option value="0" disabled>Selecciona un comercial</option>
                    <option th:each="comercial : ${comerciales}" th:value="${comercial.id}"
                            th:text="${comercial.nombre + ' ' + comercial.apellido1 + (comercial.apellido2 != null ? ' ' + comercial.apellido2 : '')}"></option>
                </select>
            </div>
            <div class="col-12 d-flex gap-2">
                <button class="btn btn-primary" type="submit">Crear</button>
                <a class="btn btn-outline-secondary" th:href="@{/pedidos}">Cancelar</a>
            </div>
        </form>
    </main>
</body>
</html>
