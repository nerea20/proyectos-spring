<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Pedidos</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <header th:replace="~{fragments/navigation :: navigation}"></header>
    <main class="container py-4">
        <p class="alert alert-info" th:if="${mensaje}" th:text="${mensaje}"></p>
        <div class="d-flex flex-column flex-sm-row align-items-sm-center justify-content-between gap-3 mb-4">
            <h1 class="h2 mb-0">Pedidos</h1>
            <a class="btn btn-primary" th:href="@{/pedidos/crear}">Crear pedido</a>
        </div>
        <div class="table-responsive">
            <table class="table table-striped table-hover align-middle">
                <thead class="table-light">
                    <tr>
                        <th scope="col">Id</th>
                        <th scope="col">Fecha</th>
                        <th scope="col">Total</th>
                        <th scope="col">Cliente</th>
                        <th scope="col">Comercial</th>
                        <th scope="col">Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="pedido : ${pedidos}">
                        <td th:text="${pedido.id}">0</td>
                        <td th:text="${pedido.fecha}">Fecha</td>
                        <td th:text="${pedido.total}">0.00</td>
                        <td th:text="${pedido.clienteNombre}">Nombre del cliente</td>
                        <td th:text="${pedido.comercialNombre}">Nombre del comercial</td>
                        <td class="text-nowrap">
                            <div class="d-flex flex-wrap gap-2">
                                <a class="btn btn-sm btn-outline-secondary" th:href="@{/pedidos/detalle/{id}(id=${pedido.id})}">Ver</a>
                                <a class="btn btn-sm btn-outline-primary" th:href="@{/pedidos/editar/{id}(id=${pedido.id})}">Editar</a>
                                <form th:action="@{/pedidos/eliminar/{id}(id=${pedido.id})}" method="post">
                                    <button class="btn btn-sm btn-outline-danger" type="submit">Eliminar</button>
                                </form>
                            </div>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(pedidos)}">
                        <td class="text-secondary" colspan="6">No hay pedidos registrados.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>
</body>
</html>
