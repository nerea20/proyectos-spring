<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Detalle del comercial</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <header th:replace="~{fragments/navigation :: navigation}"></header>
    <main class="container py-4">
        <h1 class="h2 mb-4">Detalle del comercial</h1>
        <dl class="row g-3 mb-4">
            <div class="col-12 col-md-6"><dt class="text-secondary">Id</dt><dd th:text="${comercial.id}"></dd></div>
            <div class="col-12 col-md-6"><dt class="text-secondary">Nombre</dt><dd th:text="${comercial.nombre}"></dd></div>
            <div class="col-12 col-md-6"><dt class="text-secondary">Apellido 1</dt><dd th:text="${comercial.apellido1}"></dd></div>
            <div class="col-12 col-md-6"><dt class="text-secondary">Apellido 2</dt><dd th:text="${comercial.apellido2}"></dd></div>
            <div class="col-12 col-md-6"><dt class="text-secondary">Comisión</dt><dd th:text="${comercial.comision}"></dd></div>
        </dl>
        <div class="d-flex flex-wrap gap-2">
            <a class="btn btn-outline-secondary" th:href="@{/comerciales}">Volver a comerciales</a>
            <a class="btn btn-primary" th:href="@{/comerciales/editar/{id}(id=${comercial.id})}">Editar</a>
        </div>
        <hr>
        <h2 class="h3 mb-4">Pedidos del comercial</h2>
        <div th:if="${pedidos.isEmpty()}">
            <p class="text-muted">No hay pedidos asociados a este comercial.</p>
        </div>
        <div th:if="${!pedidos.isEmpty()}">
            <table class="table table-striped">
                <thead>
                    <tr>
                        <th>Id</th>
                        <th>Fecha</th>
                        <th>Cliente</th>
                        <th>Total</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="pedido : ${pedidos}">
                        <td th:text="${pedido.id}"></td>
                        <td th:text="${pedido.fecha}"></td>
                           <td><a th:href="@{/clientes/detalle/{id}(id=${pedido.clienteId})}"
                               th:text="${pedido.clienteNombre}"></a></td>
                        <td th:text="${pedido.total}"></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>
</body>
</html>
